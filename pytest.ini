[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -v
markers =
    unit: Tests unitarios (sin llamadas reales a AWS)
    integration: Tests de integración (requieren credenciales AWS)
    slow: Tests que tardan más de 5 segundos
