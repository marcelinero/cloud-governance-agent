name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint con flake8
        run: |
          # Errores de sintaxis o nombres indefinidos fallan el build
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # El resto se reporta como advertencia (no bloquea)
          flake8 src/ --count --max-line-length=120 --statistics --exit-zero

      - name: Verificar formato con black
        run: black --check src/ tests/ --line-length 120
        continue-on-error: true

      - name: Ejecutar tests con pytest
        run: pytest tests/ -v --cov=src --cov-report=term-missing
